<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Menu đứng hai cấp</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      .menu_dung {
        width: 220px;
        margin: 20px auto;
        font-family: Arial, sans-serif;
        border: 1px solid #555;
      }
      .menu_theloai {
        background-color: #444;
        color: #fff;
        padding: 10px 14px;
        font-weight: bold;
        cursor: pointer;
        border-bottom: 1px solid #666;
      }
      .menu_theloai:hover {
        background-color: #222;
      }
      .menu_nhom {
        display: none;
        background-color: #777;
      }
      .menu_nhom a {
        display: block;
        padding: 8px 24px;
        color: #fff;
        text-decoration: none;
        border-bottom: 1px solid #888;
        font-size: 14px;
      }
      .menu_nhom a:hover {
        background-color: #555;
      }
    </style>
  </head>
  <body>
    <div class="menu_dung">
      <div class="menu_theloai">Đời sống</div>
      <div class="menu_nhom">
        <a href="?idTL=15">Hoa hậu</a>
        <a href="?idTL=16">Nghệ sĩ</a>
        <a href="?idTL=17">Mỹ thuật</a>
      </div>

      <div class="menu_theloai">Giải trí</div>
      <div class="menu_nhom">
        <a href="?idTL=18">Âm nhạc</a>
        <a href="?idTL=19">Thời trang</a>
        <a href="?idTL=20">Điện ảnh</a>
      </div>

      <div class="menu_theloai">Thể thao</div>
      <div class="menu_nhom">
        <a href="?idTL=21">Bóng đá</a>
        <a href="?idTL=22">Tennis</a>
        <a href="?idTL=23">Các môn khác</a>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        $(".menu_theloai").click(function () {
          $(this).next(".menu_nhom").slideToggle(200);
        });
      });
    </script>
  </body>
</html>
