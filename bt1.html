<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Menu ngang hai cấp</title>
    <style>
      .menu_ngang {
        width: 960px;
        margin: 20px auto;
        background-color: #444;
      }
      .menu_ngang ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .menu_ngang > ul::after {
        content: "";
        display: block;
        clear: both;
      }
      .menu_ngang > ul > li {
        float: left;
        position: relative;
      }
      .menu_ngang li a {
        display: block;
        padding: 0 18px;
        line-height: 40px;
        color: #fff;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      .menu_ngang li a:hover {
        background-color: #222;
      }
      .menu_ngang ul ul {
        display: none;
        position: absolute;
        top: 40px;
        left: 0;
        width: 180px;
        background-color: #666;
        z-index: 10;
      }
      .menu_ngang ul li:hover > ul {
        display: block;
      }
      .menu_ngang ul ul li a {
        line-height: 34px;
        border-top: 1px solid #777;
      }
    </style>
  </head>
  <body>
    <div class="menu_ngang">
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Giới thiệu</a></li>
        <li>
          <a href="#">Sản phẩm</a>
          <ul>
            <li><a href="#">Tivi</a></li>
            <li><a href="#">Tủ lạnh</a></li>
            <li><a href="#">Laptop</a></li>
            <li><a href="#">Máy tính bảng</a></li>
            <li><a href="#">Điện thoại</a></li>
          </ul>
        </li>
        <li><a href="#">Dịch vụ</a></li>
        <li><a href="#">Tin tức</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </div>
  </body>
</html>
